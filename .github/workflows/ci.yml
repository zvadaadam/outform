name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build npm package
        run: bun run build

      - name: Build and smoke-test standalone binary
        run: |
          bun run build:binary -- --target bun-linux-x64
          artifacts/outform-linux-x64 --version
          artifacts/outform-linux-x64 README.md > /tmp/outform-readme.md
          test -s /tmp/outform-readme.md
