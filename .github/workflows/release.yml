name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

      - run: bun run typecheck
      - run: bun test
      - run: npm run build
      - run: npm pack --dry-run

  binaries:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-x64
          - bun-linux-x64-musl
          - bun-windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build:binary -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: outform-${{ matrix.target }}
          path: artifacts/outform-*
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - name: Publish if this version is not already on npm
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "outform@$VERSION" version >/dev/null 2>&1; then
            echo "outform@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Publish GitHub release
    needs: [binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: outform-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum outform-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
